    <text class="legenda" x="0" y="12" font-weight="700">Relações:</text>
    <line class="l" x1="70" y1="8" x2="105" y2="8" marker-end="url(#aberta)"/><text class="legenda" x="111" y="12">serve</text>
    <line class="l" x1="160" y1="8" x2="195" y2="8" marker-end="url(#cheia)"/><text class="legenda" x="201" y="12">dispara</text>
    <line class="l" x1="260" y1="8" x2="295" y2="8" marker-start="url(#bolinha)" marker-end="url(#cheia)"/><text class="legenda" x="301" y="12">atribui</text>
    <line class="l tracejada" x1="355" y1="8" x2="390" y2="8" marker-end="url(#vazada)"/><text class="legenda" x="396" y="12">realiza</text>
    <line class="l tracejada" x1="450" y1="8" x2="485" y2="8" marker-end="url(#aberta)"/><text class="legenda" x="491" y="12">influencia</text>
    <line class="l tracejada" x1="560" y1="8" x2="595" y2="8" marker-end="url(#cheia)"/><text class="legenda" x="601" y="12">fluxo</text>
    <line class="l pontilhada" x1="645" y1="8" x2="680" y2="8" marker-end="url(#aberta)"/><text class="legenda" x="686" y="12">acessa</text>
    <line class="l" x1="745" y1="8" x2="780" y2="8" marker-start="url(#losango)"/><text class="legenda" x="786" y="12">compõe</text>
    <line class="l" x1="850" y1="8" x2="885" y2="8"/><text class="legenda" x="891" y="12">associa</text>
