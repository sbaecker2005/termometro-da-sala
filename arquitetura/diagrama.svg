<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 1035" width="1310" height="1035" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Termômetro da Sala: arquitetura em quatro camadas (ArchiMate)</title>
  <desc id="descricao">Camadas de motivação, negócio, aplicação e tecnologia, com os elementos e as relações do modelo termometro-da-sala.xml.</desc>
  <style>
    text { font-family: Segoe UI, Arial, Helvetica, sans-serif; fill: #1b1b1b; }
    .faixa { stroke: #8a8a8a; stroke-width: 1; }
    .rotulo { font-size: 15px; font-weight: 700; }
    .caixa { stroke: #555; stroke-width: 1; }
    .mot { fill: #d9ccf2; } .neg { fill: #fff3b0; } .apl { fill: #c5e5f7; } .tec { fill: #c9edc2; }
    .tipo { font-size: 9px; font-style: italic; fill: #555; text-anchor: middle; }
    .nome { font-size: 11.5px; text-anchor: middle; }
    .l { fill: none; stroke: #333; stroke-width: 1.1; }
    .tracejada { stroke-dasharray: 6 4; }
    .pontilhada { stroke-dasharray: 2 3; }
    .legenda { font-size: 11px; }
    .rel { font-size: 10px; fill: #333; }
  </style>
  <defs>
    <marker id="aberta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#333" stroke-width="1.3"/></marker>
    <marker id="cheia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#333"/></marker>
    <marker id="vazada" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#fff" stroke="#333"/></marker>
    <marker id="losango" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto"><path d="M1 5 L7 1 L13 5 L7 9 Z" fill="#333"/></marker>
    <marker id="bolinha" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto"><circle cx="4" cy="4" r="3" fill="#333"/></marker>
  </defs>

  <rect width="1310" height="1035" fill="#fff"/>

  <!-- Faixas -->
  <rect class="faixa" x="20" y="20" width="1270" height="265" fill="#f3effb"/><text class="rotulo" x="32" y="40">Motivação</text>
  <rect class="faixa" x="20" y="300" width="1270" height="256" fill="#fffbe6"/><text class="rotulo" x="32" y="320">Negócio</text>
  <rect class="faixa" x="20" y="572" width="1270" height="193" fill="#ecf7fd"/><text class="rotulo" x="32" y="592">Aplicação</text>
  <rect class="faixa" x="20" y="782" width="1270" height="193" fill="#eefaeb"/><text class="rotulo" x="32" y="802">Tecnologia</text>

  <!-- Associação -->
  <g class="l">
    <line x1="200" y1="95" x2="230" y2="101"/>
    <line x1="200" y1="141" x2="230" y2="135"/>
    <line x1="200" y1="933" x2="230" y2="933"/>
  </g>
  <!-- Influência -->
  <g class="l tracejada" marker-end="url(#aberta)">
    <line x1="390" y1="118" x2="420" y2="118"/>
    <line x1="580" y1="103" x2="640" y2="92"/>
    <line x1="580" y1="133" x2="640" y2="144"/>
  </g>
  <!-- Realização -->
  <g class="l tracejada" marker-end="url(#vazada)">
    <line x1="1040" y1="104" x2="1110" y2="92"/>
    <line x1="1040" y1="132" x2="1110" y2="144"/>
    <line x1="209" y1="210" x2="420" y2="143"/>
    <line x1="354" y1="210" x2="456" y2="146"/>
