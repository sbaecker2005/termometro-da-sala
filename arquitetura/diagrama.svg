    <line x1="646" y1="210" x2="544" y2="146"/>
    <line x1="120" y1="410" x2="120" y2="266"/>
    <line x1="173" y1="410" x2="427" y2="266"/>
    <line x1="310" y1="410" x2="310" y2="266"/>
    <polyline points="818,410 785,395 785,300 733,266"/>
    <polyline points="946,410 975,398 975,300 962,146"/>
    <polyline points="384,905 400,899 400,640 390,638"/>
  </g>
