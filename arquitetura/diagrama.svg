  <g class="l" marker-end="url(#cheia)">
    <line x1="200" y1="438" x2="230" y2="438"/>
    <line x1="390" y1="438" x2="420" y2="438"/>
    <line x1="580" y1="438" x2="610" y2="438"/>
    <line x1="770" y1="438" x2="800" y2="438"/>
  </g>
  <line class="l tracejada" x1="200" y1="853" x2="230" y2="853" marker-end="url(#cheia)"/>
  <!-- Atribuição -->
  <g class="l" marker-start="url(#bolinha)" marker-end="url(#cheia)">
    <polyline points="574,386 590,392 870,392 874,410"/>
    <line x1="813" y1="386" x2="757" y2="410"/>
    <line x1="880" y1="386" x2="880" y2="410"/>
  </g>
  <!-- Serviço -->
  <g class="l" marker-end="url(#aberta)">
    <line x1="500" y1="410" x2="500" y2="386"/>
    <polyline points="563,410 590,398 795,398 820,386"/>
    <line x1="690" y1="410" x2="690" y2="386"/>
    <line x1="960" y1="404" x2="1003" y2="386"/>
    <line x1="376" y1="661" x2="433" y2="685"/>
    <line x1="500" y1="685" x2="500" y2="661"/>
    <line x1="560" y1="685" x2="610" y2="661"/>
    <line x1="580" y1="700" x2="900" y2="646"/>
    <polyline points="247,685 220,673 220,590 138,466"/>
    <line x1="310" y1="605" x2="310" y2="466"/>
    <line x1="500" y1="605" x2="500" y2="466"/>
    <line x1="646" y1="605" x2="524" y2="466"/>
    <polyline points="563,605 585,595 785,560 858,466"/>
    <line x1="938" y1="605" x2="732" y2="466"/>
    <line x1="966" y1="605" x2="894" y2="466"/>
