  <!-- Motivação -->
  <g class="mot caixa"><rect x="40" y="50" width="160" height="56"/><rect x="40" y="130" width="160" height="56"/><rect x="230" y="90" width="160" height="56"/><rect x="420" y="90" width="160" height="56"/><rect x="640" y="50" width="160" height="56"/><rect x="640" y="130" width="160" height="56"/><rect x="880" y="90" width="160" height="56"/><rect x="1110" y="50" width="160" height="56"/><rect x="1110" y="130" width="160" height="56"/><rect x="40" y="210" width="160" height="56"/><rect x="230" y="210" width="160" height="56"/><rect x="420" y="210" width="160" height="56"/><rect x="610" y="210" width="160" height="56"/></g>
  <text class="tipo" x="120" y="65">Direcionador</text><text class="nome" x="120" y="84">Ondas de calor</text>
  <text class="tipo" x="120" y="145">Direcionador</text><text class="nome" x="120" y="164">Salas sem climatização</text>
  <text class="tipo" x="310" y="105">Avaliação</text><text class="nome" x="310" y="121">Ninguém mede o calor</text><text class="nome" x="310" y="136">dentro da sala</text>
  <text class="tipo" x="500" y="105">Objetivo</text><text class="nome" x="500" y="121">Nenhuma aula em</text><text class="nome" x="500" y="136">Perigo sem ação</text>
  <text class="tipo" x="720" y="65">Objetivo</text><text class="nome" x="720" y="81">ODS 3.d: alerta precoce</text><text class="nome" x="720" y="96">de riscos à saúde</text>
  <text class="tipo" x="720" y="145">Objetivo</text><text class="nome" x="720" y="161">ODS 13.1: resiliência</text><text class="nome" x="720" y="176">a riscos do clima</text>
  <text class="tipo" x="960" y="105">Resultado</text><text class="nome" x="960" y="121">Histórico por sala para</text><text class="nome" x="960" y="136">priorizar obras</text>
  <text class="tipo" x="1190" y="65">Objetivo</text><text class="nome" x="1190" y="81">ODS 4.a: ambientes</text><text class="nome" x="1190" y="96">de ensino seguros</text>
  <text class="tipo" x="1190" y="145">Objetivo</text><text class="nome" x="1190" y="161">ODS 11.b: cidades com</text><text class="nome" x="1190" y="176">plano de adaptação</text>
  <text class="tipo" x="120" y="225">Requisito</text><text class="nome" x="120" y="241">LED na porta funciona</text><text class="nome" x="120" y="256">sem internet</text>
  <text class="tipo" x="310" y="225">Requisito</text><text class="nome" x="310" y="241">Prever o nível da sala</text><text class="nome" x="310" y="256">em 2 h</text>
  <text class="tipo" x="500" y="225">Requisito</text><text class="nome" x="500" y="244">Aceitar só leitura assinada</text>
  <text class="tipo" x="690" y="225">Requisito</text><text class="nome" x="690" y="244">Nenhum dado de aluno</text>

  <!-- Negócio -->
  <g class="neg caixa"><rect x="420" y="330" width="160" height="56"/><rect x="610" y="330" width="160" height="56"/><rect x="800" y="330" width="160" height="56"/><rect x="990" y="330" width="160" height="56"/><rect x="40" y="410" width="160" height="56" rx="14"/><rect x="230" y="410" width="160" height="56" rx="14"/><rect x="420" y="410" width="160" height="56" rx="14"/><rect x="610" y="410" width="160" height="56" rx="14"/><rect x="800" y="410" width="160" height="56" rx="14"/><rect x="990" y="410" width="160" height="56"/><rect x="602" y="490" width="160" height="56"/><rect x="990" y="490" width="160" height="56"/></g>
  <text class="tipo" x="500" y="345">Ator</text><text class="nome" x="500" y="364">Professor(a)</text>
  <text class="tipo" x="690" y="345">Ator</text><text class="nome" x="690" y="364">Turma</text>
  <text class="tipo" x="880" y="345">Ator</text><text class="nome" x="880" y="364">Coordenação pedagógica</text>
  <text class="tipo" x="1070" y="345">Ator</text><text class="nome" x="1070" y="364">Diretoria de Ensino</text>
  <text class="tipo" x="120" y="425">Processo</text><text class="nome" x="120" y="444">Medir</text>
  <text class="tipo" x="310" y="425">Processo</text><text class="nome" x="310" y="444">Prever</text>
  <text class="tipo" x="500" y="425">Processo</text><text class="nome" x="500" y="444">Alertar</text>
  <text class="tipo" x="690" y="425">Processo</text><text class="nome" x="690" y="444">Agir</text>
  <text class="tipo" x="880" y="425">Processo</text><text class="nome" x="880" y="444">Registrar</text>
  <text class="tipo" x="1070" y="425">Objeto de negócio</text><text class="nome" x="1070" y="444">Ocorrência da sala</text>
  <text class="tipo" x="682" y="505">Objeto de negócio</text><text class="nome" x="682" y="521">Protocolo de calor</text><text class="nome" x="682" y="536">(ações por nível)</text>
  <text class="tipo" x="1070" y="505">Objeto de negócio</text><text class="nome" x="1070" y="524">Relatório por sala</text>

  <!-- Aplicação -->
  <g class="apl caixa"><rect x="230" y="605" width="160" height="56"/><rect x="420" y="605" width="160" height="56"/><rect x="590" y="605" width="160" height="56"/><rect x="900" y="605" width="160" height="56"/><rect x="40" y="685" width="160" height="56"/><rect x="230" y="685" width="160" height="56"/><rect x="420" y="685" width="160" height="56"/><rect x="740" y="685" width="160" height="56"/></g>
  <text class="tipo" x="310" y="620">Componente</text><text class="nome" x="310" y="636">Modelo de ML</text><text class="nome" x="310" y="651">(regressão linear)</text>
  <text class="tipo" x="500" y="620">Componente</text><text class="nome" x="500" y="636">App do professor</text><text class="nome" x="500" y="651">(Expo)</text>
  <text class="tipo" x="670" y="620">Componente</text><text class="nome" x="670" y="636">Painel web</text><text class="nome" x="670" y="651">(mural da TV)</text>
  <text class="tipo" x="980" y="620">Componente</text><text class="nome" x="980" y="636">Terminal da coordenação</text><text class="nome" x="980" y="651">(Windows Forms)</text>
  <text class="tipo" x="120" y="700">Objeto de dados</text><text class="nome" x="120" y="719">Leitura assinada</text>
  <text class="tipo" x="310" y="700">Componente</text><text class="nome" x="310" y="716">Assinante MQTT</text><text class="nome" x="310" y="731">(MQTTnet)</text>
  <text class="tipo" x="500" y="700">Componente</text><text class="nome" x="500" y="716">API Termômetro da Sala</text><text class="nome" x="500" y="731">(ASP.NET Core 8)</text>
  <text class="tipo" x="820" y="700">Objeto de dados</text><text class="nome" x="820" y="719">Previsão da sala</text>

  <!-- Tecnologia -->
  <g class="tec caixa"><rect x="40" y="825" width="160" height="56"/><rect x="230" y="825" width="160" height="56"/><rect x="420" y="825" width="160" height="56"/><rect x="610" y="825" width="160" height="56"/><rect x="780" y="825" width="160" height="56"/><rect x="40" y="905" width="160" height="56" rx="14"/><rect x="230" y="905" width="160" height="56"/><rect x="420" y="905" width="160" height="56"/><rect x="610" y="905" width="160" height="56"/></g>
  <text class="tipo" x="120" y="840">Dispositivo</text><text class="nome" x="120" y="856">ESP32 + DHT22 + LEDs</text><text class="nome" x="120" y="871">(Wokwi)</text>
  <text class="tipo" x="310" y="840">Software de sistema</text><text class="nome" x="310" y="859">Broker MQTT público</text>
  <text class="tipo" x="500" y="840">Software de sistema</text><text class="nome" x="500" y="859">IIS</text>
  <text class="tipo" x="690" y="840">Software de sistema</text><text class="nome" x="690" y="859">DNS</text>
  <text class="tipo" x="860" y="840">Software de sistema</text><text class="nome" x="860" y="859">SQL Server</text>
  <text class="tipo" x="120" y="920">Serviço</text><text class="nome" x="120" y="936">Dados horários do INMET</text><text class="nome" x="120" y="951">(A701)</text>
  <text class="tipo" x="310" y="920">Artefato</text><text class="nome" x="310" y="939">modelo.json</text>
  <text class="tipo" x="500" y="920">Software de sistema</text><text class="nome" x="500" y="936">Active Directory</text><text class="nome" x="500" y="951">(termometro.local)</text>
  <text class="tipo" x="690" y="920">Nó</text><text class="nome" x="690" y="939">Windows Server (VM)</text>

  <text class="rel" x="196" y="818" text-anchor="start">leitura assinada</text>
  <text class="rel" x="205" y="926" text-anchor="middle">treina</text>

  <!-- Legenda -->
